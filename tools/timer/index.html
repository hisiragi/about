<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイマー＆ストップウォッチ|hisiragi</title>
    <link rel="icon" media="(prefers-color-scheme: light)" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23000000' d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E">
    <link rel="icon" media="(prefers-color-scheme: dark)" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23FFFFFF' d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/%3E%3C/svg%3E">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="tab-bar">
            <button class="tab-button active" data-tab="timer">
                <span class="material-icons">timer</span>
                タイマー
            </button>
            <button class="tab-button" data-tab="stopwatch">
                <span class="material-icons">timer</span>
                ストップウォッチ
            </button>
        </div>

        <div class="content">
            <!-- タイマータブ -->
            <div class="tab-content active" id="timer">
                <div class="timer-list">
                    <button id="addTimerButton" class="add-button">
                        <span class="material-icons">add</span>
                        新しいタイマー
                    </button>
                    <div id="activeTimers" class="active-timers"></div>
                </div>
            </div>

            <!-- ストップウォッチタブ -->
            <div class="tab-content" id="stopwatch">
                <div class="stopwatch-container">
                    <div class="stopwatch-display">
                        <div class="time">00:00:00.00</div>
                    </div>
                    <div class="lap-times-container">
                        <div class="lap-times-header">
                            <span>ラップ</span>
                            <span>ラップタイム</span>
                            <span>合計時間</span>
                        </div>
                        <div class="lap-times"></div>
                    </div>
                    <div class="stopwatch-controls">
                        <button class="control-button lap-button" disabled>
                            <span class="material-icons">flag</span>
                            ラップ
                        </button>
                        <button class="control-button start-button">
                            <span class="material-icons">play_arrow</span>
                            開始
                        </button>
                        <button class="control-button reset-button" disabled>
                            <span class="material-icons">refresh</span>
                            リセット
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新規タイマー設定モーダル -->
    <div class="modal" id="timerModal">
        <div class="modal-content">
            <h2>タイマーを設定</h2>
            <div class="time-picker">
                <div class="picker-section">
                    <input type="number" class="time-input hours" min="0" max="99" value="0">
                    <span class="time-label">時間</span>
                </div>
                <div class="picker-section">
                    <input type="number" class="time-input minutes" min="0" max="59" value="0">
                    <span class="time-label">分</span>
                </div>
                <div class="picker-section">
                    <input type="number" class="time-input seconds" min="0" max="59" value="0">
                    <span class="time-label">秒</span>
                </div>
            </div>
            <div class="sound-selection">
                <label>終了音</label>
                <select id="timerSound"></select>
                <input type="file" id="customSound" accept="audio/*" multiple>
                <label for="customSound" class="custom-sound-button">
                    <span class="material-icons">upload_file</span>
                    カスタムサウンドを追加
                </label>
            </div>
            <div class="modal-buttons">
                <button class="cancel-button">キャンセル</button>
                <button class="save-button">保存</button>
            </div>
        </div>
    </div>

    <template id="timerTemplate">
        <div class="timer-item">
            <div class="timer-info">
                <div class="timer-time">00:00:00</div>
                <div class="timer-progress">
                    <div class="progress-bar">
                        <div class="progress"></div>
                    </div>
                </div>
            </div>
            <div class="timer-controls">
                <button class="timer-button pause-button">
                    <span class="material-icons">pause</span>
                </button>
                <button class="timer-button cancel-button">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </div>
    </template>

    <audio id="timerAudio"></audio>
    <script src="script.js"></script>
</body>
</html>
